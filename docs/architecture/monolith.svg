<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Addax monolith architecture</title>
  <desc id="desc">A user sends a YouTube URL to the Next.js client, which calls one Express application. The application stores data in MongoDB and calls YouTube, Jina, Gemini, and Groq.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:12}.core{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:14}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.ext{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="510" fill="#f8fafc"/>
  <text x="55" y="53" class="title">Addax — Monolith architecture</text>
  <text x="55" y="80" class="small">One deployable backend owns every feature. Solid choice for the first release.</text>
  <rect x="55" y="205" width="140" height="85" class="box"/><text x="125" y="240" text-anchor="middle" class="label">User</text><text x="125" y="263" text-anchor="middle" class="small">browser</text>
  <rect x="265" y="185" width="185" height="125" class="box"/><text x="357" y="227" text-anchor="middle" class="label">Next.js client</text><text x="357" y="251" text-anchor="middle" class="small">URL, summary &amp; chat UI</text><text x="357" y="272" text-anchor="middle" class="small">authentication screens</text>
  <rect x="525" y="120" width="325" height="250" class="core"/><text x="687" y="160" text-anchor="middle" class="label">Express API — one application</text><line x1="550" y1="178" x2="825" y2="178" stroke="#7dd3fc" stroke-width="2"/><text x="570" y="211" class="small">Auth &amp; users</text><text x="570" y="240" class="small">Videos &amp; transcripts</text><text x="570" y="269" class="small">Embeddings &amp; retrieval</text><text x="570" y="298" class="small">Summaries &amp; chat</text><text x="570" y="333" class="small">Background transcript processing</text>
  <rect x="925" y="105" width="205" height="90" class="data"/><text x="1027" y="142" text-anchor="middle" class="label">MongoDB</text><text x="1027" y="166" text-anchor="middle" class="small">Prisma data store</text>
  <rect x="925" y="250" width="205" height="55" class="ext"/><text x="1027" y="283" text-anchor="middle" class="label">YouTube</text>
  <rect x="925" y="330" width="205" height="55" class="ext"/><text x="1027" y="363" text-anchor="middle" class="label">Jina · Gemini · Groq</text>
  <path d="M195 247 H265" class="flow"/><text x="225" y="229" text-anchor="middle" class="small">1. use app</text>
  <path d="M450 247 H525" class="flow"/><text x="487" y="229" text-anchor="middle" class="small">2. API request</text>
  <path d="M850 160 H925" class="flow"/><path d="M850 276 H925" class="flow"/><path d="M850 352 H925" class="flow"/>
  <text x="687" y="423" text-anchor="middle" class="small">User flow: paste URL → API gets transcript → stores/chunks it → user reads summary or asks a question.</text>
</svg>
