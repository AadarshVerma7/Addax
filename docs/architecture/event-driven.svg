<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Addax event-driven architecture</title><desc id="desc">Submitting a video creates events. Worker services consume events for metadata, transcript processing, embeddings, summaries, and ready notifications.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:12}.bus{fill:#fdf4ff;stroke:#a855f7;stroke-width:2;rx:14}.svc{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="590" fill="#f8fafc"/><text x="55" y="53" class="title">Addax — Event-driven architecture</text><text x="55" y="80" class="small">Asynchronous workers make transcript and AI processing resilient and scalable.</text>
  <rect x="45" y="250" width="125" height="80" class="box"/><text x="107" y="282" text-anchor="middle" class="label">User</text><text x="107" y="307" text-anchor="middle" class="small">pastes URL</text>
  <rect x="215" y="235" width="170" height="110" class="box"/><text x="300" y="276" text-anchor="middle" class="label">Next.js + API</text><text x="300" y="300" text-anchor="middle" class="small">accepts request</text><text x="300" y="321" text-anchor="middle" class="small">returns “processing”</text>
  <rect x="445" y="215" width="195" height="150" class="bus"/><text x="542" y="258" text-anchor="middle" class="label">Event bus / queue</text><text x="542" y="286" text-anchor="middle" class="small">video.created</text><text x="542" y="310" text-anchor="middle" class="small">transcript.ready</text><text x="542" y="334" text-anchor="middle" class="small">video.ready</text>
  <rect x="705" y="105" width="190" height="70" class="svc"/><text x="800" y="136" text-anchor="middle" class="label">Ingestion worker</text><text x="800" y="158" text-anchor="middle" class="small">YouTube metadata/transcript</text>
  <rect x="705" y="225" width="190" height="70" class="svc"/><text x="800" y="256" text-anchor="middle" class="label">Learning worker</text><text x="800" y="278" text-anchor="middle" class="small">chunks · Jina embeddings</text>
  <rect x="705" y="345" width="190" height="70" class="svc"/><text x="800" y="376" text-anchor="middle" class="label">Summary worker</text><text x="800" y="398" text-anchor="middle" class="small">Gemini study notes</text>
  <rect x="705" y="465" width="190" height="70" class="svc"/><text x="800" y="496" text-anchor="middle" class="label">Chat API</text><text x="800" y="518" text-anchor="middle" class="small">retrieval · Groq answer</text>
  <rect x="960" y="220" width="165" height="80" class="data"/><text x="1042" y="252" text-anchor="middle" class="label">MongoDB</text><text x="1042" y="276" text-anchor="middle" class="small">video state &amp; data</text>
  <rect x="960" y="375" width="165" height="65" class="data"/><text x="1042" y="405" text-anchor="middle" class="label">Notifications</text><text x="1042" y="427" text-anchor="middle" class="small">polling / websocket</text>
  <path d="M170 290 H215 M385 290 H445 M640 260 H705 M640 290 H665 V260 H705 M640 320 H670 V380 H705 M895 140 H925 V260 H960 M895 260 H960 M895 380 H925 V260 H960 M895 500 H925 V260 H960 M895 500 H925 V407 H960" class="flow"/>
  <path d="M1042 300 V350 H300 V345" class="flow"/><text x="542" y="558" text-anchor="middle" class="small">User flow: submit URL → event → workers process in stages → video marked ready → user sees summary and can chat.</text>
</svg>
