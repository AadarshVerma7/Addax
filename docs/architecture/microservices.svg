<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Addax microservices architecture</title><desc id="desc">The Next.js client uses an API gateway to reach separately deployed auth, video ingestion, AI learning, and conversation services.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:12}.svc{fill:#eef2ff;stroke:#6366f1;stroke-width:2;rx:12}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.ext{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="590" fill="#f8fafc"/><text x="55" y="53" class="title">Addax — Microservices architecture</text><text x="55" y="80" class="small">Independently deploy services when teams and traffic profiles genuinely differ.</text>
  <rect x="45" y="255" width="125" height="80" class="box"/><text x="107" y="288" text-anchor="middle" class="label">User</text><text x="107" y="312" text-anchor="middle" class="small">browser</text>
  <rect x="220" y="235" width="155" height="120" class="box"/><text x="297" y="278" text-anchor="middle" class="label">Next.js client</text><text x="297" y="302" text-anchor="middle" class="small">web experience</text>
  <rect x="425" y="255" width="145" height="80" class="box"/><text x="497" y="287" text-anchor="middle" class="label">API gateway</text><text x="497" y="311" text-anchor="middle" class="small">routing &amp; auth</text>
  <rect x="640" y="105" width="180" height="75" class="svc"/><text x="730" y="137" text-anchor="middle" class="label">Identity service</text><text x="730" y="160" text-anchor="middle" class="small">users · Google auth</text>
  <rect x="640" y="215" width="180" height="75" class="svc"/><text x="730" y="247" text-anchor="middle" class="label">Video service</text><text x="730" y="270" text-anchor="middle" class="small">metadata · transcript</text>
  <rect x="640" y="325" width="180" height="75" class="svc"/><text x="730" y="357" text-anchor="middle" class="label">Learning service</text><text x="730" y="380" text-anchor="middle" class="small">embeddings · summaries</text>
  <rect x="640" y="435" width="180" height="75" class="svc"/><text x="730" y="467" text-anchor="middle" class="label">Chat service</text><text x="730" y="490" text-anchor="middle" class="small">retrieval · messages</text>
  <rect x="895" y="160" width="190" height="65" class="data"/><text x="990" y="190" text-anchor="middle" class="label">Service-owned data</text><text x="990" y="212" text-anchor="middle" class="small">MongoDB databases</text>
  <rect x="895" y="360" width="190" height="80" class="ext"/><text x="990" y="392" text-anchor="middle" class="label">External AI &amp; video</text><text x="990" y="415" text-anchor="middle" class="small">YouTube · Jina · Gemini · Groq</text>
  <path d="M170 295 H220 M375 295 H425 M570 295 H610 V142 H640 M570 295 H640 M570 295 H610 V362 H640 M570 295 H610 V472 H640" class="flow"/>
  <path d="M820 142 H895 M820 252 H860 V192 H895 M820 362 H895 M820 472 H860 V400 H895" class="flow"/>
  <text x="497" y="548" text-anchor="middle" class="small">User flow: paste URL / ask question → gateway → responsible service → its data and providers → response.</text>
</svg>
